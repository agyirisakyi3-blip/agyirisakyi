<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Agyiri Sakyi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 6rem; font-weight: 900; background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    p { font-size: 1.2rem; color: #94a3b8; margin: 16px 0 32px; }
    a { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border-radius: 50px; text-decoration: none; font-weight: 600; transition: transform .2s; }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Page not found — let's get you back on track.</p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
